id = "herdr-dog"
name = "Herdr Dog"
version = "0.2.0"
min_herdr_version = "0.9.3"
description = "Run project-defined setup commands after Herdr creates a worktree"
platforms = ["linux", "macos"]

[[build]]
command = ["/bin/sh", "scripts/install-binary"]

[[events]]
on = "worktree.created"
command = ["./bin/herdr-dog"]
